<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | TechNova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><h1>Tech<span>Nova</span></h1></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Contáctanos</h2>
            <p>Déjanos tus datos y nos pondremos en contacto contigo a la brevedad.</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" autocomplete="name">
                    <span class="error" id="error-nombre"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" autocomplete="email">
                    <span class="error" id="error-email"></span>
                </div>

                <div class="form-group">
                    <label for="producto">Producto de Interés:</label>
                    <select id="producto" name="producto">
                        <option value="">-- Seleccione un producto --</option>
                        <option value="smartphone">Smartphone X</option>
                        <option value="laptop">Laptop Pro</option>
                        <option value="watch">Watch Ultra</option>
                    </select>
                    <span class="error" id="error-producto"></span>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4"></textarea>
                    <span class="error" id="error-mensaje"></span>
                </div>

                <button type="submit" class="btn-submit">Enviar Solicitud</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 TechNova S.A. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
